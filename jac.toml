[project]
name = "lane"
version = "1.0.0"
description = "Lane is a personal semester planner for coursework, study blocks, and what to do next."
default-app = "web"
jac-version = "==0.37.23"

[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"
platform = "web"

[apps.cli]
kind = "cli"
entry-point = "cli.main"

[apps.planner]
kind = "service"
entry-point = "core.planner"

[dependencies]

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-native-web = "^0.21.2"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
port = 8000

[client]

[client.app_meta_data]
title = "Lane"
description = "Personal semester planner for coursework, study blocks, and what to do next."
author = "Miguel Moncada-Larrotiz"
theme_color = "#c24d1d"
